name: 自动编译生成 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 初始化 Java 17 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 生成签名 keystore 与完整项目源码
        run: |
          mkdir -p app/src/main/java/com/example/refreshratecalculator/core
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore app/debug.keystore \
            -storepass android \
            -storetype PKCS12 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          cat > build.gradle << 'GRADLE_PROJECT'
          plugins {
              id 'com.android.application' version '8.0.2' apply false
          }
          GRADLE_PROJECT

          cat > app/build.gradle << 'GRADLE_APP'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.refreshratecalculator'
              compileSdk 33
              defaultConfig {
                  applicationId 'com.example.refreshratecalculator'
                  minSdk 21; targetSdk 33; versionCode 1; versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              signingConfigs {
                  debug {
                      storeFile file('debug.keystore')
                      storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.debug }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          GRADLE_APP

          cat > settings.gradle << 'GRADLE_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'RefreshRateCalculator'
          include ':app'
          GRADLE_SETTINGS

          cat > gradle.properties << 'GRADLE_PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          GRADLE_PROPS

          cat > app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:allowBackup="true"
                           android:label="刷新率计算器"
                           android:icon="@mipmap/ic_launcher"
                           android:roundIcon="@mipmap/ic_launcher"
                           android:supportsRtl="true"
                           android:theme="@style/Theme.RefreshRateCalculator">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_EOF

          cat > app/src/main/res/values/strings.xml << 'STRINGS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">刷新率计算器</string>
          </resources>
          STRINGS_EOF

          cat > app/src/main/res/values/themes.xml << 'THEMES_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.RefreshRateCalculator" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">#6200EE</item>
                  <item name="colorPrimaryVariant">#3700B3</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="colorSecondary">#03DAC5</item>
                  <item name="colorSecondaryVariant">#018786</item>
                  <item name="colorOnSecondary">#000000</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:windowTranslucentStatus">true</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          THEMES_EOF

          cat > app/src/main/res/values/colors.xml << 'COLORS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="purple_200">#FFBB86FC</color>
              <color name="purple_500">#FF6200EE</color>
              <color name="purple_700">#FF3700B3</color>
              <color name="teal_200">#FF03DAC5</color>
              <color name="teal_700">#FF018786</color>
              <color name="black">#FF000000</color>
              <color name="white">#FFFFFFFF</color>
              <color name="ic_launcher_background">#6200EE</color>
              <color name="result_bg">#F5F5F5</color>
              <color name="divider_color">#E0E0E0</color>
          </resources>
          COLORS_EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'ICON_FG_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <group android:translateX="22" android:translateY="22">
                  <path android:fillColor="#FFFFFF"
                      android:pathData="M32,0C14.33,0,0,14.33,0,32s14.33,32,32,32s32,-14.33,32,-32S49.67,0,32,0zM38,18h12v4h-12V18zM14,18h12v4H14V18zM14,26h36v4H14V26zM14,34h36v4H14V34zM14,42h28v4H14V42z" />
              </group>
          </vector>
          ICON_FG_EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'ADAPTIVE_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          ADAPTIVE_EOF

          cat > app/src/main/res/drawable/edit_text_bg.xml << 'ETBG_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#F0F0F0"/>
              <corners android:radius="8dp"/>
              <stroke android:width="1dp" android:color="#DDDDDD"/>
          </shape>
          ETBG_EOF

          cat > app/src/main/res/layout/activity_main.xml << 'LAYOUT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fitsSystemWindows="true"
              android:background="?android:attr/colorBackground">

              <TextView
                  android:id="@+id/tvTitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="刷新率计算器"
                  android:textSize="20sp"
                  android:textStyle="bold"
                  android:textColor="@color/purple_500"
                  android:layout_marginTop="8dp"
                  app:layout_constraintTop_toTopOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <View
                  android:id="@+id/divider"
                  android:layout_width="0dp"
                  android:layout_height="1dp"
                  android:background="@color/divider_color"
                  android:layout_marginTop="12dp"
                  app:layout_constraintTop_toBottomOf="@id/tvTitle"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent" />

              <LinearLayout
                  android:id="@+id/modeBar"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:orientation="horizontal"
                  android:gravity="center_vertical"
                  android:paddingHorizontal="16dp"
                  android:layout_marginTop="8dp"
                  app:layout_constraintTop_toBottomOf="@id/divider"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="常规计算"
                      android:textSize="16sp"
                      android:textColor="#333333"
                      android:gravity="end"
                      android:paddingEnd="8dp" />

                  <Switch
                      android:id="@+id/switchMode"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content" />

                  <TextView
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_weight="1"
                      android:text="时钟计算"
                      android:textSize="16sp"
                      android:textColor="#333333"
                      android:gravity="start"
                      android:paddingStart="8dp" />
              </LinearLayout>

              <ScrollView
                  android:id="@+id/panelNormal"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:fillViewport="true"
                  android:visibility="visible"
                  android:padding="16dp"
                  app:layout_constraintTop_toBottomOf="@id/modeBar"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical">

                          <EditText
                              android:id="@+id/etNormalInput"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="3"
                              android:hint="输入数值（如 255 或 0xFF）"
                              android:inputType="text"
                              android:textSize="16sp"
                              android:padding="12dp"
                              android:background="@drawable/edit_text_bg" />

                          <Spinner
                              android:id="@+id/spinnerRadix"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="2"
                              android:layout_marginStart="8dp"
                              android:padding="4dp" />
                      </LinearLayout>

                      <View
                          android:layout_width="match_parent"
                          android:layout_height="1dp"
                          android:background="@color/divider_color"
                          android:layout_marginTop="16dp"
                          android:layout_marginBottom="12dp" />

                      <TextView
                          android:id="@+id/tvNormalResult"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@color/result_bg"
                          android:padding="16dp"
                          android:text="Dec: —\nHex: —\nOct: —\nBin: —"
                          android:textIsSelectable="true"
                          android:typeface="monospace"
                          android:textSize="15sp"
                          android:lineSpacingExtra="4dp" />

                      <Button
                          android:id="@+id/btnCopyNormal"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="复制结果"
                          android:layout_marginTop="12dp"
                          style="@style/Widget.MaterialComponents.Button.OutlinedButton" />
                  </LinearLayout>
              </ScrollView>

              <ScrollView
                  android:id="@+id/panelClock"
                  android:layout_width="0dp"
                  android:layout_height="0dp"
                  android:fillViewport="true"
                  android:visibility="gone"
                  android:padding="16dp"
                  app:layout_constraintTop_toBottomOf="@id/modeBar"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintEnd_toEndOf="parent">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="基准刷新率 (Hz)"
                          android:textSize="14sp"
                          android:textColor="#555555"
                          android:layout_marginTop="4dp" />
                      <EditText
                          android:id="@+id/etBaseHz"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:hint="例如 144"
                          android:inputType="number"
                          android:textSize="16sp"
                          android:padding="12dp"
                          android:background="@drawable/edit_text_bg"
                          android:layout_marginTop="4dp" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="基准时钟频率（十进制或0x十六进制）"
                          android:textSize="14sp"
                          android:textColor="#555555"
                          android:layout_marginTop="12dp" />
                      <EditText
                          android:id="@+id/etBaseClock"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:hint="例如 648000000 或 0x26a53c00"
                          android:inputType="text"
                          android:textSize="16sp"
                          android:padding="12dp"
                          android:background="@drawable/edit_text_bg"
                          android:layout_marginTop="4dp" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="目标刷新率列表（空格/逗号分隔）"
                          android:textSize="14sp"
                          android:textColor="#555555"
                          android:layout_marginTop="12dp" />
                      <EditText
                          android:id="@+id/etTargetHz"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:hint="例如 147 150 156"
                          android:inputType="text"
                          android:textSize="16sp"
                          android:padding="12dp"
                          android:background="@drawable/edit_text_bg"
                          android:layout_marginTop="4dp" />

                      <Button
                          android:id="@+id/btnCalculate"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="计算"
                          android:layout_marginTop="16dp" />

                      <View
                          android:layout_width="match_parent"
                          android:layout_height="1dp"
                          android:background="@color/divider_color"
                          android:layout_marginTop="12dp"
                          android:layout_marginBottom="8dp" />

                      <TextView
                          android:id="@+id/tvResult"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:background="@color/result_bg"
                          android:padding="12dp"
                          android:text="计算结果将显示在这里"
                          android:textIsSelectable="true"
                          android:typeface="monospace"
                          android:textSize="14sp"
                          android:lineSpacingExtra="2dp" />

                      <Button
                          android:id="@+id/btnCopyClock"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="复制结果"
                          android:layout_marginTop="12dp"
                          style="@style/Widget.MaterialComponents.Button.OutlinedButton" />
                  </LinearLayout>
              </ScrollView>

          </androidx.constraintlayout.widget.ConstraintLayout>
          LAYOUT_EOF

          cat > app/src/main/java/com/example/refreshratecalculator/core/ConverterUtil.java << 'CONV_EOF'
          package com.example.refreshratecalculator.core;
          import java.util.ArrayList;
          import java.util.List;
          public class ConverterUtil {
              public static class ClockResult {
                  public final long targetHz;
                  public final long targetClockDec;
                  public final String targetClockHex;
                  public ClockResult(long targetHz, long targetClockDec) {
                      this.targetHz = targetHz;
                      this.targetClockDec = targetClockDec;
                      this.targetClockHex = Long.toHexString(targetClockDec);
                  }
                  public String toDtsiFragment() {
                      return String.format(
                          "qcom,mdss-dsi-panel-framerate = <0x%s>;\nqcom,mdss-dsi-panel-clockrate = <0x%s>;",
                          Long.toHexString(targetHz), targetClockHex
                      );
                  }
              }
              public static List<ClockResult> calculateClock(long baseHz, long baseClockDec, List<Long> targetHzList) {
                  List<ClockResult> results = new ArrayList<>();
                  for (long targetHz : targetHzList) {
                      long targetClockDec = Math.round((double) baseClockDec * targetHz / baseHz);
                      results.add(new ClockResult(targetHz, targetClockDec));
                  }
                  return results;
              }
              public static String decToBin(long dec) { return Long.toBinaryString(dec); }
              public static String decToOct(long dec) { return Long.toOctalString(dec); }
              public static String decToHex(long dec) { return Long.toHexString(dec); }
              public static long binToDec(String bin) { return Long.parseLong(bin, 2); }
              public static long octToDec(String oct) { return Long.parseLong(oct, 8); }
              public static long hexToDec(String hex) { return Long.parseLong(hex.replaceFirst("^0[xX]", ""), 16); }
              public static long autoParseToDec(String input) {
                  if (input == null || input.isEmpty()) throw new IllegalArgumentException("输入为空");
                  String t = input.trim();
                  if (t.startsWith("0x") || t.startsWith("0X")) return hexToDec(t);
                  if (t.startsWith("0b") || t.startsWith("0B")) return binToDec(t.substring(2));
                  if (t.startsWith("0") && t.length() > 1) {
                      String wo = t.substring(1);
                      if (wo.matches("[0-7]+")) return octToDec(wo);
                  }
                  return Long.parseLong(t);
              }
              public static String getFullRadixInfo(long value) {
                  return String.format("Dec: %d\nHex: 0x%s\nOct: 0%s\nBin: %s",
                      value, Long.toHexString(value), Long.toOctalString(value), Long.toBinaryString(value));
              }
          }
          CONV_EOF

          cat > app/src/main/java/com/example/refreshratecalculator/MainActivity.java << 'MAIN_EOF'
          package com.example.refreshratecalculator;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextUtils;
          import android.text.TextWatcher;
          import android.view.View;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.Spinner;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import com.example.refreshratecalculator.core.ConverterUtil;
          import java.util.ArrayList;
          import java.util.List;
          public class MainActivity extends AppCompatActivity {
              private Switch switchMode;
              private View panelNormal, panelClock;
              private EditText etNormalInput;
              private Spinner spinnerRadix;
              private TextView tvNormalResult;
              private Button btnCopyNormal;
              private EditText etBaseHz, etBaseClock, etTargetHz;
              private Button btnCalculate;
              private TextView tvResult;
              private Button btnCopyClock;
              private String lastNormalResult = "";
              private String lastClockResult = "";
              private int currentRadixMode = 0;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  switchMode = findViewById(R.id.switchMode);
                  panelNormal = findViewById(R.id.panelNormal);
                  panelClock = findViewById(R.id.panelClock);
                  etNormalInput = findViewById(R.id.etNormalInput);
                  spinnerRadix = findViewById(R.id.spinnerRadix);
                  tvNormalResult = findViewById(R.id.tvNormalResult);
                  btnCopyNormal = findViewById(R.id.btnCopyNormal);
                  etBaseHz = findViewById(R.id.etBaseHz);
                  etBaseClock = findViewById(R.id.etBaseClock);
                  etTargetHz = findViewById(R.id.etTargetHz);
                  btnCalculate = findViewById(R.id.btnCalculate);
                  tvResult = findViewById(R.id.tvResult);
                  btnCopyClock = findViewById(R.id.btnCopyClock);

                  String[] radixOptions = {"自动识别 (0x/0b/0)", "十进制 (Dec)", "十六进制 (Hex)", "二进制 (Bin)", "八进制 (Oct)"};
                  ArrayAdapter<String> radixAdapter = new ArrayAdapter<>(this,
                      android.R.layout.simple_spinner_item, radixOptions);
                  radixAdapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
                  spinnerRadix.setAdapter(radixAdapter);
                  spinnerRadix.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {
                      @Override public void onItemSelected(AdapterView<?> parent, View view, int position, long id) {
                          currentRadixMode = position;
                          updateNormalConversion();
                      }
                      @Override public void onNothingSelected(AdapterView<?> parent) { }
                  });

                  etNormalInput.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) { }
                      @Override public void onTextChanged(CharSequence s, int start, int before, int count) {
                          updateNormalConversion();
                      }
                      @Override public void afterTextChanged(Editable s) { }
                  });

                  switchMode.setOnCheckedChangeListener((buttonView, isChecked) -> {
                      if (isChecked) {
                          panelNormal.setVisibility(View.GONE);
                          panelClock.setVisibility(View.VISIBLE);
                      } else {
                          panelNormal.setVisibility(View.VISIBLE);
                          panelClock.setVisibility(View.GONE);
                      }
                  });

                  btnCalculate.setOnClickListener(v -> performClockCalculation());
                  btnCopyNormal.setOnClickListener(v -> copyToClipboard(lastNormalResult, "常规转换结果已复制"));
                  btnCopyClock.setOnClickListener(v -> copyToClipboard(lastClockResult, "时钟计算结果已复制"));
              }

              private void updateNormalConversion() {
                  String input = etNormalInput.getText().toString().trim();
                  if (input.isEmpty()) {
                      tvNormalResult.setText("Dec: —\nHex: —\nOct: —\nBin: —");
                      lastNormalResult = "";
                      return;
                  }
                  try {
                      long value;
                      switch (currentRadixMode) {
                          case 1: value = Long.parseLong(input); break;
                          case 2: value = ConverterUtil.hexToDec(input); break;
                          case 3: value = ConverterUtil.binToDec(input); break;
                          case 4: value = ConverterUtil.octToDec(input); break;
                          default: value = ConverterUtil.autoParseToDec(input); break;
                      }
                      String result = ConverterUtil.getFullRadixInfo(value);
                      tvNormalResult.setText(result);
                      lastNormalResult = result;
                  } catch (Exception e) {
                      tvNormalResult.setText("输入无效，请检查格式");
                      lastNormalResult = "";
                  }
              }

              private void performClockCalculation() {
                  String baseHzStr = etBaseHz.getText().toString().trim();
                  String baseClockStr = etBaseClock.getText().toString().trim();
                  String targetHzStr = etTargetHz.getText().toString().trim();
                  if (TextUtils.isEmpty(baseHzStr)) { etBaseHz.setError("请输入基准刷新率"); etBaseHz.requestFocus(); return; }
                  if (TextUtils.isEmpty(baseClockStr)) { etBaseClock.setError("请输入基准时钟频率"); etBaseClock.requestFocus(); return; }
                  if (TextUtils.isEmpty(targetHzStr)) { etTargetHz.setError("请输入目标刷新率"); etTargetHz.requestFocus(); return; }
                  try {
                      long baseHz = Long.parseLong(baseHzStr);
                      if (baseHz <= 0) { showToast("基准刷新率必须 > 0"); return; }
                      long baseClockDec = ConverterUtil.autoParseToDec(baseClockStr);
                      if (baseClockDec <= 0) { showToast("基准时钟频率必须 > 0"); return; }
                      String[] parts = targetHzStr.replace(",", " ").trim().split("\\s+");
                      List<Long> targetHzList = new ArrayList<>();
                      for (String p : parts) {
                          if (!p.isEmpty()) {
                              long hz = Long.parseLong(p);
                              if (hz <= 0) { showToast("目标刷新率必须 > 0: " + p); return; }
                              targetHzList.add(hz);
                          }
                      }
                      if (targetHzList.isEmpty()) { showToast("请输入至少一个目标刷新率"); return; }
                      List<ConverterUtil.ClockResult> results = ConverterUtil.calculateClock(baseHz, baseClockDec, targetHzList);
                      StringBuilder sb = new StringBuilder();
                      sb.append("基准: ").append(baseHz).append(" Hz @ 0x")
                        .append(Long.toHexString(baseClockDec).toUpperCase())
                        .append(" (").append(baseClockDec).append(")\n");
                      sb.append("────────────────────────\n");
                      for (ConverterUtil.ClockResult r : results) {
                          sb.append(r.targetHz).append(" Hz → ")
                            .append(r.targetClockDec).append(" (0x")
                            .append(r.targetClockHex.toUpperCase()).append(")\n");
                      }
                      String output = sb.toString();
                      tvResult.setText(output);
                      lastClockResult = output;
                  } catch (NumberFormatException e) {
                      showToast("解析失败: " + (e.getMessage() != null ? e.getMessage() : "数值格式错误"));
                  } catch (IllegalArgumentException e) {
                      showToast("参数错误: " + e.getMessage());
                  }
              }

              private void copyToClipboard(String text, String successMsg) {
                  if (text == null || text.isEmpty()) {
                      showToast("没有可复制的内容");
                      return;
                  }
                  ClipboardManager clipboard = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                  ClipData clip = ClipData.newPlainText("result", text);
                  clipboard.setPrimaryClip(clip);
                  showToast(successMsg);
              }

              private void showToast(String msg) {
                  Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
              }
          }
          MAIN_EOF

      - name: 4. 用官方标准 Action 建立合规的 Gradle 包装器
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'
          generate-job-summary: true

      - name: 5. 编译生成 Debug APK
        run: gradle assembleDebug

      - name: 6. 提炼并分发 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: RefreshRate-v2.0
          path: app/build/outputs/apk/debug/app-debug.apk

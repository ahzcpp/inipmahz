name: 构建快手极速版权限Hook模块

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 生成完整LSP模块项目源码
        run: |
          mkdir -p app/src/main/java/com/hook/kuaishou
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets
          mkdir -p gradle/wrapper

          # ── settings.gradle ───────────────────────────────
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  google()
                  mavenCentral()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://api.xposed.info/' }
              }
          }
          rootProject.name = "KuaishouPermissionHook"
          include ':app'
          EOF

          # ── build.gradle root ─────────────────────────────
          cat > build.gradle << 'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # ── app/build.gradle ──────────────────────────────
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hook.kuaishou'
              compileSdk 34

              defaultConfig {
                  applicationId "com.hook.kuaishou"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
              compileOnly 'de.robv.android.xposed:api:82:sources'
          }
          EOF

          # ── gradle wrapper ────────────────────────────────
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          cat > gradlew << 'EOF'
          #!/bin/sh
          exec gradle "$@"
          EOF
          chmod +x gradlew

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > app/proguard-rules.pro << 'EOF'
          -keep class com.hook.kuaishou.** { *; }
          -keep class de.robv.android.xposed.** { *; }
          -keepattributes *Annotation*
          EOF

          # ── AndroidManifest.xml ───────────────────────────
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  
                  <meta-data
                      android:name="xposedmodule"
                      android:value="true" />
                  
                  <meta-data
                      android:name="xposeddescription"
                      android:value="快手极速版权限伪装模块 - Hook摄像头、麦克风、文件访问权限" />
                  
                  <meta-data
                      android:name="xposedminversion"
                      android:value="93" />
                  
                  <meta-data
                      android:name="xposedscope"
                      android:resource="@array/xposed_scope" />

              </application>

          </manifest>
          EOF

          # ── strings.xml ───────────────────────────────────
          cat > app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">快手极速版权限Hook</string>
          </resources>
          EOF

          # ── arrays.xml ────────────────────────────────────
          cat > app/src/main/res/values/arrays.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string-array name="xposed_scope">
                  <item>com.kuaishou.nebula</item>
              </string-array>
          </resources>
          EOF

          # ── xposed_init ───────────────────────────────────
          cat > app/src/main/assets/xposed_init << 'EOF'
          com.hook.kuaishou.MainHook
          EOF

          # ── 图标背景 ──────────────────────────────────────
          cat > app/src/main/res/drawable/ic_launcher_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#2196F3"/>
          </shape>
          EOF

          # ── 图标前景（Hook符号） ──────────────────────────
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M35,40 L35,68 M35,40 L50,40 Q60,40 60,50 Q60,54 56,54 M56,54 L73,54 M56,54 Q60,54 60,64 Q60,68 50,68 L35,68"/>
              <path android:fillColor="#FFFFFF"
                  android:pathData="M40,30 L40,78 L68,78 L68,70 L48,70 L48,30 Z"/>
          </vector>
          EOF

          # ── 自适应图标 ────────────────────────────────────
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          # ── MainHook.java ─────────────────────────────────
          cat > app/src/main/java/com/hook/kuaishou/MainHook.java << 'EOF'
          package com.hook.kuaishou;

          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.hardware.camera2.CameraAccessException;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioRecord;
          import android.os.Environment;

          import java.io.File;

          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XC_MethodReplacement;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class MainHook implements IXposedHookLoadPackage {

              private static final String TAG = "KuaishouPermissionHook";
              private static final String TARGET_PACKAGE = "com.kuaishou.nebula";

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable {
                  if (!lpparam.packageName.equals(TARGET_PACKAGE)) {
                      return;
                  }

                  XposedBridge.log(TAG + ": 开始Hook快手极速版");

                  hookPermissionCheck(lpparam);
                  hookCameraAPIs(lpparam);
                  hookAudioAPIs(lpparam);
                  hookFileAPIs(lpparam);
                  hookStorageAPIs(lpparam);
              }

              private void hookPermissionCheck(XC_LoadPackage.LoadPackageParam lpparam) {
                  XposedHelpers.findAndHookMethod(
                          Context.class,
                          "checkSelfPermission",
                          String.class,
                          new XC_MethodHook() {
                              @Override
                              protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                                  String permission = (String) param.args[0];
                                  if (permission.equals("android.permission.CAMERA") ||
                                      permission.equals("android.permission.RECORD_AUDIO") ||
                                      permission.equals("android.permission.READ_EXTERNAL_STORAGE") ||
                                      permission.equals("android.permission.WRITE_EXTERNAL_STORAGE") ||
                                      permission.equals("android.permission.MANAGE_EXTERNAL_STORAGE")) {
                                      param.setResult(PackageManager.PERMISSION_GRANTED);
                                      XposedBridge.log(TAG + ": 伪装权限检查 - " + permission);
                                  }
                              }
                          }
                  );

                  XposedHelpers.findAndHookMethod(
                          Context.class,
                          "checkPermission",
                          String.class,
                          int.class,
                          int.class,
                          new XC_MethodHook() {
                              @Override
                              protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                                  String permission = (String) param.args[0];
                                  if (permission.equals("android.permission.CAMERA") ||
                                      permission.equals("android.permission.RECORD_AUDIO") ||
                                      permission.equals("android.permission.READ_EXTERNAL_STORAGE") ||
                                      permission.equals("android.permission.WRITE_EXTERNAL_STORAGE") ||
                                      permission.equals("android.permission.MANAGE_EXTERNAL_STORAGE")) {
                                      param.setResult(PackageManager.PERMISSION_GRANTED);
                                      XposedBridge.log(TAG + ": 伪装权限检查2 - " + permission);
                                  }
                              }
                          }
                  );
              }

              private void hookCameraAPIs(XC_LoadPackage.LoadPackageParam lpparam) {
                  try {
                      XposedHelpers.findAndHookMethod(
                              CameraManager.class,
                              "getCameraIdList",
                              new XC_MethodReplacement() {
                                  @Override
                                  protected Object replaceHookedMethod(MethodHookParam param) throws Throwable {
                                      XposedBridge.log(TAG + ": 拦截获取摄像头列表");
                                      return new String[0];
                                  }
                              }
                      );

                      XposedHelpers.findAndHookMethod(
                              CameraManager.class,
                              "openCamera",
                              String.class,
                              android.hardware.camera2.CameraDevice.StateCallback.class,
                              android.os.Handler.class,
                              new XC_MethodHook() {
                                  @Override
                                  protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                                      XposedBridge.log(TAG + ": 拦截打开摄像头");
                                      throw new CameraAccessException(CameraAccessException.CAMERA_DISABLED, "摄像头已被禁用");
                                  }
                              }
                      );

                      XposedHelpers.findAndHookMethod(
                              CameraManager.class,
                              "getCameraCharacteristics",
                              String.class,
                              new XC_MethodHook() {
                                  @Override
                                  protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                                      XposedBridge.log(TAG + ": 拦截获取摄像头特性");
                                      throw new CameraAccessException(CameraAccessException.CAMERA_DISABLED, "摄像头已被禁用");
                                  }
                              }
                      );
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + ": Hook摄像头API失败 - " + t.getMessage());
                  }

                  try {
                      Class<?> cameraClass = XposedHelpers.findClass("android.hardware.Camera", lpparam.classLoader);
                      XposedHelpers.findAndHookMethod(
                              cameraClass,
                              "open",
                              new XC_MethodHook() {
                                  @Override
                                  protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                                      XposedBridge.log(TAG + ": 拦截Camera.open()");
                                      throw new RuntimeException("摄像头不可用");
                                  }
                              }
                      );

                      XposedHelpers.findAndHookMethod(
                              cameraClass,
                              "open",
                              int.class,
                              new XC_MethodHook() {
                                  @Override
                                  protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                                      XposedBridge.log(TAG + ": 拦截Camera.open(int)");
                                      throw new RuntimeException("摄像头不可用");
                                  }
                              }
                      );

                      XposedHelpers.findAndHookMethod(
                              cameraClass,
                              "getNumberOfCameras",
                              new XC_MethodReplacement() {
                                  @Override
                                  protected Object replaceHookedMethod(MethodHookParam param) throws Throwable {
                                      XposedBridge.log(TAG + ": 返回摄像头数量为0");
                                      return 0;
                                  }
                              }
                      );
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + ": Hook Camera类失败 - " + t.getMessage());
                  }
              }

              private void hookAudioAPIs(XC_LoadPackage.LoadPackageParam lpparam) {
                  try {
                      XposedHelpers.findAndHookConstructor(
                              AudioRecord.class,
                              int.class,
                              int.class,
                              int.class,
                              int.class,
                              int.class,
                              new XC_MethodHook() {
                                  @Override
                                  protected void afterHookedMethod(MethodHookParam param) throws Throwable {
                                      XposedBridge.log(TAG + ": 拦截AudioRecord构造");
                                      throw new IllegalStateException("麦克风不可用");
                                  }
                              }
                      );

                      XposedHelpers.findAndHookMethod(
                              AudioRecord.class,
                              "startRecording",
                              new XC_MethodHook() {
                                  @Override
                                  protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                                      XposedBridge.log(TAG + ": 拦截开始录音");
                                      throw new IllegalStateException("麦克风不可用");
                                  }
                              }
                      );
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + ": Hook音频API失败 - " + t.getMessage());
                  }
              }

              private void hookFileAPIs(XC_LoadPackage.LoadPackageParam lpparam) {
                  try {
                      XposedHelpers.findAndHookMethod(
                              File.class,
                              "listFiles",
                              new XC_MethodHook() {
                                  @Override
                                  protected void afterHookedMethod(MethodHookParam param) throws Throwable {
                                      File file = (File) param.thisObject;
                                      String path = file.getAbsolutePath();
                                      if (isRestrictedPath(path)) {
                                          XposedBridge.log(TAG + ": 拦截访问敏感目录 - " + path);
                                          param.setResult(new File[0]);
                                      }
                                  }
                              }
                      );

                      XposedHelpers.findAndHookMethod(
                              File.class,
                              "list",
                              new XC_MethodHook() {
                                  @Override
                                  protected void afterHookedMethod(MethodHookParam param) throws Throwable {
                                      File file = (File) param.thisObject;
                                      String path = file.getAbsolutePath();
                                      if (isRestrictedPath(path)) {
                                          XposedBridge.log(TAG + ": 拦截列出敏感目录 - " + path);
                                          param.setResult(new String[0]);
                                      }
                                  }
                              }
                      );

                      XposedHelpers.findAndHookMethod(
                              File.class,
                              "exists",
                              new XC_MethodHook() {
                                  @Override
                                  protected void afterHookedMethod(MethodHookParam param) throws Throwable {
                                      File file = (File) param.thisObject;
                                      String path = file.getAbsolutePath();
                                      if (isRestrictedPath(path)) {
                                          XposedBridge.log(TAG + ": 隐藏敏感文件存在性 - " + path);
                                          param.setResult(false);
                                      }
                                  }
                              }
                      );

                      XposedHelpers.findAndHookMethod(
                              File.class,
                              "canRead",
                              new XC_MethodHook() {
                                  @Override
                                  protected void afterHookedMethod(MethodHookParam param) throws Throwable {
                                      File file = (File) param.thisObject;
                                      String path = file.getAbsolutePath();
                                      if (isRestrictedPath(path)) {
                                          XposedBridge.log(TAG + ": 拦截读取权限检查 - " + path);
                                          param.setResult(false);
                                      }
                                  }
                              }
                      );

                      XposedHelpers.findAndHookMethod(
                              File.class,
                              "canWrite",
                              new XC_MethodHook() {
                                  @Override
                                  protected void afterHookedMethod(MethodHookParam param) throws Throwable {
                                      File file = (File) param.thisObject;
                                      String path = file.getAbsolutePath();
                                      if (isRestrictedPath(path)) {
                                          XposedBridge.log(TAG + ": 拦截写入权限检查 - " + path);
                                          param.setResult(false);
                                      }
                                  }
                              }
                      );
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + ": Hook文件API失败 - " + t.getMessage());
                  }
              }

              private void hookStorageAPIs(XC_LoadPackage.LoadPackageParam lpparam) {
                  try {
                      XposedHelpers.findAndHookMethod(
                              Environment.class,
                              "getExternalStorageDirectory",
                              new XC_MethodReplacement() {
                                  @Override
                                  protected Object replaceHookedMethod(MethodHookParam param) throws Throwable {
                                      XposedBridge.log(TAG + ": 返回虚拟外部存储路径");
                                      return new File("/data/user/0/" + TARGET_PACKAGE + "/files/virtual_storage");
                                  }
                              }
                      );

                      XposedHelpers.findAndHookMethod(
                              Environment.class,
                              "getExternalStoragePublicDirectory",
                              String.class,
                              new XC_MethodReplacement() {
                                  @Override
                                  protected Object replaceHookedMethod(MethodHookParam param) throws Throwable {
                                      String type = (String) param.args[0];
                                      XposedBridge.log(TAG + ": 返回虚拟公共目录 - " + type);
                                      return new File("/data/user/0/" + TARGET_PACKAGE + "/files/virtual_storage/" + type);
                                  }
                              }
                      );
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + ": Hook存储API失败 - " + t.getMessage());
                  }
              }

              private boolean isRestrictedPath(String path) {
                  if (path == null) return false;
                  
                  String lowerPath = path.toLowerCase();
                  return lowerPath.contains("/dcim") ||
                         lowerPath.contains("/pictures") ||
                         lowerPath.contains("/download") ||
                         lowerPath.contains("/documents") ||
                         lowerPath.contains("/movies") ||
                         lowerPath.contains("/music") ||
                         lowerPath.contains("/alarms") ||
                         lowerPath.contains("/ringtones") ||
                         lowerPath.contains("/notifications") ||
                         (lowerPath.contains("/storage/emulated") && !lowerPath.contains(TARGET_PACKAGE));
              }
          }
          EOF

      - name: 编译APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: 快手极速版权限Hook模块
          path: app/build/outputs/apk/release/*.apk

      - name: 创建Release（如果是tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ---- 3j. 创建 ConverterUtil.java（核心计算逻辑，支持 10/16/8/2 进制） ----
          cat > app/src/main/java/com/example/refreshratecalculator/core/ConverterUtil.java << 'CONVERTER'
package com.example.refreshratecalculator.core;

import java.util.ArrayList;
import java.util.List;

/**
 * 进制转换与刷新率/时钟频率计算工具类
 * 支持：十进制、十六进制、八进制、二进制相互转换
 */
public class ConverterUtil {

    /**
     * 单个时钟频率计算结果
     */
    public static class ClockResult {
        public final long targetHz;
        public final long targetClockDec;
        public final String targetClockHex;

        public ClockResult(long targetHz, long targetClockDec) {
            this.targetHz = targetHz;
            this.targetClockDec = targetClockDec;
            this.targetClockHex = Long.toHexString(targetClockDec);
        }

        /**
         * 生成 dtsi 设备树片段
         */
        public String toDtsiFragment() {
            return String.format(
                "qcom,mdss-dsi-panel-framerate = <0x%s>;\nqcom,mdss-dsi-panel-clockrate = <0x%s>;",
                Long.toHexString(targetHz),
                targetClockHex
            );
        }

        /**
         * 生成进制转换表行
         */
        public String toRadixRow() {
            return String.format(
                "%d Hz → Dec: %d | Hex: 0x%s | Oct: 0%s | Bin: %s",
                targetHz, targetHz,
                Long.toHexString(targetHz),
                Long.toOctalString(targetHz),
                Long.toBinaryString(targetHz)
            );
        }
    }

    /**
     * 计算目标刷新率对应的时钟频率
     * 公式：targetClock = (baseClock * targetHz) / baseHz
     */
    public static List<ClockResult> calculateClock(
            long baseHz, long baseClockDec, List<Long> targetHzList) {
        List<ClockResult> results = new ArrayList<>();
        for (long targetHz : targetHzList) {
            // 使用浮点运算再四舍五入，与 Shell 脚本 awk 行为一致
            long targetClockDec = Math.round((double) baseClockDec * targetHz / baseHz);
            results.add(new ClockResult(targetHz, targetClockDec));
        }
        return results;
    }

    // ================================================================
    // 进制转换工具方法
    // ================================================================

    /**
     * 十进制 → 二进制字符串
     */
    public static String decToBin(long dec) {
        return Long.toBinaryString(dec);
    }

    /**
     * 十进制 → 八进制字符串（不含前导 0）
     */
    public static String decToOct(long dec) {
        return Long.toOctalString(dec);
    }

    /**
     * 十进制 → 十六进制字符串（不含 0x 前缀）
     */
    public static String decToHex(long dec) {
        return Long.toHexString(dec);
    }

    /**
     * 二进制字符串 → 十进制
     */
    public static long binToDec(String bin) {
        return Long.parseLong(bin, 2);
    }

    /**
     * 八进制字符串 → 十进制
     */
    public static long octToDec(String oct) {
        return Long.parseLong(oct, 8);
    }

    /**
     * 十六进制字符串（可含 0x/0X 前缀）→ 十进制
     */
    public static long hexToDec(String hex) {
        String cleaned = hex.replaceFirst("^0[xX]", "");
        return Long.parseLong(cleaned, 16);
    }

    /**
     * 自动识别进制并转为十进制
     * 支持: 纯数字→十进制, 0x/0X前缀→十六进制, 0前缀→八进制, 0b/0B前缀→二进制
     */
    public static long autoParseToDec(String input) {
        if (input == null || input.isEmpty()) {
            throw new IllegalArgumentException("输入为空");
        }
        String trimmed = input.trim();
        if (trimmed.startsWith("0x") || trimmed.startsWith("0X")) {
            return hexToDec(trimmed);
        } else if (trimmed.startsWith("0b") || trimmed.startsWith("0B")) {
            return binToDec(trimmed.substring(2));
        } else if (trimmed.startsWith("0") && trimmed.length() > 1) {
            // 必须全是 0-7 字符才按八进制处理
            String withoutLeading = trimmed.substring(1);
            if (withoutLeading.matches("[0-7]+")) {
                return octToDec(withoutLeading);
            }
        }
        return Long.parseLong(trimmed);
    }

    /**
     * 获取某个值的完整进制转换摘要
     */
    public static String getFullRadixInfo(long value) {
        return String.format(
            "Dec: %d\nHex: 0x%s\nOct: 0%s\nBin: %s",
            value,
            Long.toHexString(value),
            Long.toOctalString(value),
            Long.toBinaryString(value)
        );
    }
}
CONVERTER

          # ---- 3k. 创建 MainActivity.java ----
          cat > app/src/main/java/com/example/refreshratecalculator/MainActivity.java << 'MAINACTIVITY'
package com.example.refreshratecalculator;

import android.os.Bundle;
import android.text.TextUtils;
import android.view.View;
import android.widget.Button;
import android.widget.EditText;
import android.widget.TextView;
import android.widget.Toast;

import androidx.appcompat.app.AppCompatActivity;

import com.example.refreshratecalculator.core.ConverterUtil;

import java.util.ArrayList;
import java.util.List;

public class MainActivity extends AppCompatActivity {

    private EditText etBaseHz;
    private EditText etBaseClock;
    private EditText etTargetHz;
    private Button btnCalculate;
    private TextView tvResult;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);

        // 绑定视图
        etBaseHz = findViewById(R.id.etBaseHz);
        etBaseClock = findViewById(R.id.etBaseClock);
        etTargetHz = findViewById(R.id.etTargetHz);
        btnCalculate = findViewById(R.id.btnCalculate);
        tvResult = findViewById(R.id.tvResult);

        // 点击计算
        btnCalculate.setOnClickListener(new View.OnClickListener() {
            @Override
            public void onClick(View v) {
                performCalculation();
            }
        });
    }

    private void performCalculation() {
        String baseHzStr = etBaseHz.getText().toString().trim();
        String baseClockStr = etBaseClock.getText().toString().trim();
        String targetHzStr = etTargetHz.getText().toString().trim();

        // 基本空值校验
        if (TextUtils.isEmpty(baseHzStr)) {
            etBaseHz.setError("请输入基准刷新率");
            etBaseHz.requestFocus();
            return;
        }
        if (TextUtils.isEmpty(baseClockStr)) {
            etBaseClock.setError("请输入基准时钟频率");
            etBaseClock.requestFocus();
            return;
        }
        if (TextUtils.isEmpty(targetHzStr)) {
            etTargetHz.setError("请输入目标刷新率");
            etTargetHz.requestFocus();
            return;
        }

        try {
            // 1. 解析基准刷新率（十进制）
            long baseHz = Long.parseLong(baseHzStr);
            if (baseHz <= 0) {
                showToast("基准刷新率必须 > 0");
                return;
            }

            // 2. 解析基准时钟频率（自动识别进制）
            // 支持：十进制、0x十六进制、0八进制、0b二进制
            long baseClockDec = ConverterUtil.autoParseToDec(baseClockStr);
            if (baseClockDec <= 0) {
                showToast("基准时钟频率必须 > 0");
                return;
            }

            // 3. 解析目标刷新率列表（支持空格或逗号分隔）
            String[] parts = targetHzStr.replace(",", " ").trim().split("\\s+");
            List<Long> targetHzList = new ArrayList<>();
            for (String part : parts) {
                if (!part.isEmpty()) {
                    long hz = Long.parseLong(part);
                    if (hz <= 0) {
                        showToast("目标刷新率必须 > 0: " + part);
                        return;
                    }
                    targetHzList.add(hz);
                }
            }
            if (targetHzList.isEmpty()) {
                showToast("请输入至少一个目标刷新率");
                return;
            }

            // 4. 执行计算
            List<ConverterUtil.ClockResult> results =
                    ConverterUtil.calculateClock(baseHz, baseClockDec, targetHzList);

            // 5. 组装显示结果
            StringBuilder sb = new StringBuilder();
            sb.append("======== 计算结果 ========\n");
            sb.append("基准刷新率: ").append(baseHz).append(" Hz\n");
            sb.append("基准时钟: ")
                    .append("0x").append(Long.toHexString(baseClockDec))
                    .append("  (十进制: ").append(baseClockDec).append(")\n\n");

            for (ConverterUtil.ClockResult r : results) {
                sb.append("─────────────\n");
                sb.append("目标: ").append(r.targetHz).append(" Hz\n");
                sb.append("  十进制: ").append(r.targetClockDec).append("\n");
                sb.append("  十六进制: 0x").append(r.targetClockHex).append("\n");
                sb.append("  dtsi 片段:\n");
                sb.append(r.toDtsiFragment()).append("\n");
            }

            // 额外显示进制转换（将目标Hz的Dec/Hex/Oct/Bin全列出）
            sb.append("─────────────\n");
            sb.append("目标 Hz 进制转换:\n");
            for (ConverterUtil.ClockResult r : results) {
                sb.append("  ").append(r.toRadixRow()).append("\n");
            }

            // 显示基准时钟的完整进制信息
            sb.append("─────────────\n");
            sb.append("基准时钟进制转换:\n");
            sb.append("  ").append(ConverterUtil.getFullRadixInfo(baseClockDec).replace("\n", "\n  ")).append("\n");

            tvResult.setText(sb.toString());

        } catch (NumberFormatException e) {
            String msg = e.getMessage();
            if (msg == null) msg = "数值格式错误";
            showToast("解析失败: " + msg);
        } catch (IllegalArgumentException e) {
            showToast("参数错误: " + e.getMessage());
        }
    }

    private void showToast(String msg) {
        Toast.makeText(this, msg, Toast.LENGTH_SHORT).show();
    }
}
MAINACTIVITY

      # ============================================================
      # 步骤 4：用官方标准 Action 建立合规的 Gradle 包装器
      # ============================================================
      - name: 4. 用官方标准 Action 建立合规的 Gradle 包装器
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'
          generate-job-summary: true

      # ============================================================
      # 步骤 5：编译生成 Debug APK
      # ============================================================
      - name: 5. 编译生成 Debug APK
        run: gradle assembleDebug

      # ============================================================
      # 步骤 6：提炼并分发 APK 产物
      # ============================================================
      - name: 6. 提炼并分发 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: RefreshRate-v1.0
          path: app/build/outputs/apk/debug/app-debug.apk

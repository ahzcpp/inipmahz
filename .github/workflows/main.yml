name: 自动编译生成 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create project directories
        run: |
          mkdir -p app/src/main/java/com/example/refreshratecalculator/core
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/color
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p gradle/wrapper

      # ==================== Gradle 配置文件 ====================

      - name: Write project build.gradle
        run: |
          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.0.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

      - name: Write settings.gradle
        run: |
          cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RefreshRateCalculator"
          include ':app'
          EOF

      - name: Write app/build.gradle
        run: |
          cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.refreshratecalculator'
              compileSdk 33
              defaultConfig {
                  applicationId "com.example.refreshratecalculator"
                  minSdk 21
                  targetSdk 33
                  versionCode 7
                  versionName "3.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

      - name: Write gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Write gradle-wrapper.properties
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          networkTimeout=10000
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      # ==================== Gradle Wrapper（必须在写入 gradle 文件之前执行，避免系统 Gradle 9.x 兼容问题）====================

      - name: Setup Gradle Wrapper
        run: |
          # 临时备份已有 gradle 文件（避免系统 Gradle 9.x 评估报错）
          for f in build.gradle settings.gradle app/build.gradle; do
            [ -f "$f" ] && mv "$f" "${f}.bak"
          done
          echo 'rootProject.name = "RefreshRateCalculator"' > settings.gradle
          echo "include ':app'" >> settings.gradle
          gradle wrapper --gradle-version 8.2
          rm -f settings.gradle
          # 恢复备份
          for f in build.gradle settings.gradle app/build.gradle; do
            [ -f "${f}.bak" ] && mv "${f}.bak" "$f"
          done

      # ==================== AndroidManifest ====================

      - name: Write AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.RefreshRateCalculator"
                  tools:targetApi="33">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      # ==================== Java 源文件 ====================

      - name: Write ConverterUtil.java
        run: |
          cat > app/src/main/java/com/example/refreshratecalculator/core/ConverterUtil.java << 'EOF'
          package com.example.refreshratecalculator.core;

          public class ConverterUtil {

              public static class ClockResult {
                  public String targetHz;
                  public long targetClockDec;
                  public String targetClockHex;

                  public ClockResult(String targetHz, long targetClockDec, String targetClockHex) {
                      this.targetHz = targetHz;
                      this.targetClockDec = targetClockDec;
                      this.targetClockHex = targetClockHex;
                  }

                  public String toDtsiFragment() {
                      return "/* dtsi fragment */\n"
                              + "&dsi_panel {\n"
                              + "    qcom,mdss-dsi-panel-framerate = <" + targetHz + ">;\n"
                              + "    qcom,mdss-dsi-pixel-clock-frequency = <" + targetClockDec + ">; /* 0x" + targetClockHex + " */\n"
                              + "};";
                  }
              }

              public static long autoParseToDec(String input, int radix) throws NumberFormatException {
                  String clean = input.trim().toUpperCase();
                  if (clean.startsWith("0X")) {
                      clean = clean.substring(2);
                      radix = 16;
                  } else if (clean.startsWith("0B")) {
                      clean = clean.substring(2);
                      radix = 2;
                  } else if (clean.startsWith("0O")) {
                      clean = clean.substring(2);
                      radix = 8;
                  }
                  return Long.parseLong(clean, radix);
              }

              public static String decTo(long dec, int radix) {
                  switch (radix) {
                      case 2:  return Long.toBinaryString(dec);
                      case 8:  return Long.toOctalString(dec);
                      case 10: return Long.toString(dec);
                      case 16: return Long.toHexString(dec).toUpperCase();
                      default: return Long.toString(dec, radix).toUpperCase();
                  }
              }

              public static ClockResult calculateClock(String hzInput) {
                  try {
                      double hz = Double.parseDouble(hzInput.trim());
                      long pixelClock = Math.round(1200.0 * 2800.0 * hz / 1000.0);
                      return new ClockResult(
                              String.valueOf((int) hz),
                              pixelClock,
                              Long.toHexString(pixelClock).toUpperCase()
                      );
                  } catch (NumberFormatException e) {
                      return null;
                  }
              }
          }
          EOF

      - name: Write MainActivity.java
        run: |
          cat > app/src/main/java/com/example/refreshratecalculator/MainActivity.java << 'EOF'
          package com.example.refreshratecalculator;

          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.ImageButton;
          import android.widget.LinearLayout;
          import android.widget.PopupMenu;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import com.example.refreshratecalculator.core.ConverterUtil;
          import com.example.refreshratecalculator.core.ConverterUtil.ClockResult;
          import com.google.android.material.bottomnavigation.BottomNavigationView;

          public class MainActivity extends AppCompatActivity {

              private boolean isUpdating = false;
              private boolean isClockMode = false;

              private int radix1 = 10;
              private int radix2 = 16;

              private TextView tvModeLeft, tvModeRight;
              private ImageButton btnSwitchMode;
              private TextView tvRadixLabel1, tvRadixLabel2;
              private ImageButton btnRadix1, btnRadix2;
              private EditText etInput1, etInput2;
              private ImageButton btnCopy1, btnCopy2;
              private LinearLayout clockResultArea;
              private TextView tvClockResult;
              private BottomNavigationView bottomNav;
              private LinearLayout homeContent, aboutContent;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  initViews();
                  setupListeners();
                  updateModeUI();
              }

              private void initViews() {
                  tvModeLeft = findViewById(R.id.tv_mode_left);
                  tvModeRight = findViewById(R.id.tv_mode_right);
                  btnSwitchMode = findViewById(R.id.btn_switch_mode);
                  tvRadixLabel1 = findViewById(R.id.tv_radix_label1);
                  tvRadixLabel2 = findViewById(R.id.tv_radix_label2);
                  btnRadix1 = findViewById(R.id.btn_radix1);
                  btnRadix2 = findViewById(R.id.btn_radix2);
                  etInput1 = findViewById(R.id.et_input1);
                  etInput2 = findViewById(R.id.et_input2);
                  btnCopy1 = findViewById(R.id.btn_copy1);
                  btnCopy2 = findViewById(R.id.btn_copy2);
                  clockResultArea = findViewById(R.id.clock_result_area);
                  tvClockResult = findViewById(R.id.tv_clock_result);
                  bottomNav = findViewById(R.id.bottom_nav);
                  homeContent = findViewById(R.id.home_content);
                  aboutContent = findViewById(R.id.about_content);
              }

              private void setupListeners() {
                  btnSwitchMode.setOnClickListener(v -> {
                      isClockMode = !isClockMode;
                      updateModeUI();
                      etInput1.setText("");
                      etInput2.setText("");
                      tvClockResult.setText("");
                  });

                  btnRadix1.setOnClickListener(v -> showRadixMenu(1));
                  btnRadix2.setOnClickListener(v -> showRadixMenu(2));

                  etInput1.addTextChangedListener(createTextWatcher(1));
                  etInput2.addTextChangedListener(createTextWatcher(2));

                  btnCopy1.setOnClickListener(v -> copyText(etInput1.getText().toString()));
                  btnCopy2.setOnClickListener(v -> copyText(etInput2.getText().toString()));

                  bottomNav.setOnItemSelectedListener(item -> {
                      int id = item.getItemId();
                      if (id == R.id.nav_home) {
                          homeContent.setVisibility(View.VISIBLE);
                          aboutContent.setVisibility(View.GONE);
                          return true;
                      } else if (id == R.id.nav_about) {
                          homeContent.setVisibility(View.GONE);
                          aboutContent.setVisibility(View.VISIBLE);
                          return true;
                      }
                      return false;
                  });
              }

              private void updateModeUI() {
                  if (isClockMode) {
                      tvModeLeft.setTextColor(0xFF999999);
                      tvModeRight.setTextColor(0xFF1A1A2E);
                      tvModeLeft.setAlpha(0.5f);
                      tvModeRight.setAlpha(1.0f);
                      clockResultArea.setVisibility(View.VISIBLE);
                      etInput1.setHint("输入刷新率 (Hz)");
                      etInput2.setHint("时钟频率 (自动计算)");
                      etInput2.setFocusable(false);
                      etInput2.setClickable(false);
                      etInput2.setEnabled(false);
                      tvRadixLabel1.setText("刷新率");
                      tvRadixLabel2.setText("时钟");
                      btnRadix1.setVisibility(View.GONE);
                      btnRadix2.setVisibility(View.GONE);
                  } else {
                      tvModeLeft.setTextColor(0xFF1A1A2E);
                      tvModeRight.setTextColor(0xFF999999);
                      tvModeLeft.setAlpha(1.0f);
                      tvModeRight.setAlpha(0.5f);
                      clockResultArea.setVisibility(View.GONE);
                      etInput1.setHint("输入数值");
                      etInput2.setHint("输入数值");
                      etInput2.setFocusable(true);
                      etInput2.setClickable(true);
                      etInput2.setEnabled(true);
                      tvRadixLabel1.setText(getRadixName(radix1));
                      tvRadixLabel2.setText(getRadixName(radix2));
                      btnRadix1.setVisibility(View.VISIBLE);
                      btnRadix2.setVisibility(View.VISIBLE);
                  }
              }

              private TextWatcher createTextWatcher(int source) {
                  return new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      @Override public void onTextChanged(CharSequence s, int start, int before, int count) {}
                      @Override
                      public void afterTextChanged(Editable s) {
                          if (isUpdating) return;
                          isUpdating = true;
                          convertFrom(source, s.toString());
                          isUpdating = false;
                      }
                  };
              }

              private void showRadixMenu(int which) {
                  View anchor = (which == 1) ? btnRadix1 : btnRadix2;
                  PopupMenu popup = new PopupMenu(this, anchor);
                  popup.getMenu().add(0, 2, 0, "二进制 (Bin)");
                  popup.getMenu().add(0, 8, 0, "八进制 (Oct)");
                  popup.getMenu().add(0, 10, 0, "十进制 (Dec)");
                  popup.getMenu().add(0, 16, 0, "十六进制 (Hex)");
                  popup.setOnMenuItemClickListener(item -> {
                      int radix = item.getItemId();
                      if (which == 1) {
                          radix1 = radix;
                          tvRadixLabel1.setText(getRadixName(radix));
                      } else {
                          radix2 = radix;
                          tvRadixLabel2.setText(getRadixName(radix));
                      }
                      EditText srcInput = (which == 1) ? etInput1 : etInput2;
                      if (srcInput.getText().length() > 0) {
                          isUpdating = true;
                          convertFrom(which, srcInput.getText().toString());
                          isUpdating = false;
                      }
                      return true;
                  });
                  popup.show();
              }

              private String getRadixName(int radix) {
                  switch (radix) {
                      case 2:  return "二进制";
                      case 8:  return "八进制";
                      case 10: return "十进制";
                      case 16: return "十六进制";
                      default: return "未知";
                  }
              }

              private void convertFrom(int source, String input) {
                  if (input.isEmpty()) {
                      if (source == 1) etInput2.setText("");
                      else etInput1.setText("");
                      return;
                  }

                  try {
                      if (isClockMode) {
                          if (source == 1) {
                              ClockResult result = ConverterUtil.calculateClock(input);
                              if (result != null) {
                                  etInput2.setText(result.targetClockDec + " kHz");
                                  tvClockResult.setText(
                                      "目标刷新率: " + result.targetHz + " Hz\n" +
                                      "像素时钟 (dec): " + result.targetClockDec + " kHz\n" +
                                      "像素时钟 (hex): 0x" + result.targetClockHex + "\n\n" +
                                      result.toDtsiFragment()
                                  );
                              } else {
                                  etInput2.setText("");
                                  tvClockResult.setText("请输入有效刷新率数值");
                              }
                          }
                          return;
                      }

                      int srcRadix = (source == 1) ? radix1 : radix2;
                      int dstRadix = (source == 1) ? radix2 : radix1;
                      EditText dstInput = (source == 1) ? etInput2 : etInput1;

                      long decValue = ConverterUtil.autoParseToDec(input, srcRadix);
                      String result = ConverterUtil.decTo(decValue, dstRadix);
                      dstInput.setText(result);

                  } catch (NumberFormatException e) {
                      if (source == 1) etInput2.setText("");
                      else etInput1.setText("");
                  }
              }

              private void copyText(String text) {
                  if (text.isEmpty()) {
                      Toast.makeText(this, "无内容可复制", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  ClipboardManager clipboard = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                  ClipData clip = ClipData.newPlainText("result", text);
                  clipboard.setPrimaryClip(clip);
                  Toast.makeText(this, "已复制到剪贴板", Toast.LENGTH_SHORT).show();
              }
          }
          EOF

      # ==================== Layout ====================

      - name: Write activity_main.xml
        run: |
          cat > app/src/main/res/layout/activity_main.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:orientation="vertical"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#F0F2F5">

              <ScrollView
                  android:id="@+id/home_content"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:fillViewport="true">

                  <LinearLayout
                      android:orientation="vertical"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:padding="16dp">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:layout_marginBottom="20dp">

                          <TextView
                              android:id="@+id/tv_mode_left"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="常规刷新率"
                              android:textSize="18sp"
                              android:textStyle="bold"
                              android:textColor="#1A1A2E"
                              android:gravity="end"
                              android:layout_marginEnd="12dp" />

                          <ImageButton
                              android:id="@+id/btn_switch_mode"
                              android:layout_width="52dp"
                              android:layout_height="52dp"
                              android:src="@drawable/ic_switch"
                              android:background="@drawable/ic_glass_circle"
                              android:contentDescription="切换模式"
                              android:elevation="4dp" />

                          <TextView
                              android:id="@+id/tv_mode_right"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:text="时钟刷新率"
                              android:textSize="18sp"
                              android:textStyle="bold"
                              android:textColor="#999999"
                              android:gravity="start"
                              android:layout_marginStart="12dp" />
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:layout_marginBottom="16dp">

                          <LinearLayout
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:gravity="center_vertical"
                              android:layout_marginBottom="4dp"
                              android:layout_marginStart="4dp">

                              <TextView
                                  android:id="@+id/tv_radix_label1"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="十进制"
                                  android:textSize="14sp"
                                  android:textColor="#666666" />

                              <ImageButton
                                  android:id="@+id/btn_radix1"
                                  android:layout_width="28dp"
                                  android:layout_height="28dp"
                                  android:src="@drawable/ic_expand"
                                  android:background="@drawable/bg_glass_button"
                                  android:layout_marginStart="4dp"
                                  android:contentDescription="选择进制" />
                          </LinearLayout>

                          <androidx.cardview.widget.CardView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              app:cardCornerRadius="16dp"
                              app:cardElevation="2dp"
                              app:cardBackgroundColor="#FFFFFF"
                              android:layout_margin="0dp">

                              <FrameLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content">

                                  <EditText
                                      android:id="@+id/et_input1"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:minHeight="72dp"
                                      android:textSize="24sp"
                                      android:textColor="#1A1A2E"
                                      android:textColorHint="#B0B0B0"
                                      android:hint="输入数值"
                                      android:inputType="text"
                                      android:paddingStart="20dp"
                                      android:paddingEnd="52dp"
                                      android:paddingTop="18dp"
                                      android:paddingBottom="18dp"
                                      android:background="@android:color/transparent"
                                      android:singleLine="true"
                                      android:fontFamily="monospace" />

                                  <ImageButton
                                      android:id="@+id/btn_copy1"
                                      android:layout_width="36dp"
                                      android:layout_height="36dp"
                                      android:src="@drawable/ic_copy"
                                      android:background="@drawable/ic_glass_circle"
                                      android:layout_gravity="end|top"
                                      android:layout_margin="8dp"
                                      android:contentDescription="复制" />
                              </FrameLayout>
                          </androidx.cardview.widget.CardView>
                      </LinearLayout>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:layout_marginBottom="16dp">

                          <LinearLayout
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:orientation="horizontal"
                              android:gravity="center_vertical"
                              android:layout_marginBottom="4dp"
                              android:layout_marginStart="4dp">

                              <TextView
                                  android:id="@+id/tv_radix_label2"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="十六进制"
                                  android:textSize="14sp"
                                  android:textColor="#666666" />

                              <ImageButton
                                  android:id="@+id/btn_radix2"
                                  android:layout_width="28dp"
                                  android:layout_height="28dp"
                                  android:src="@drawable/ic_expand"
                                  android:background="@drawable/bg_glass_button"
                                  android:layout_marginStart="4dp"
                                  android:contentDescription="选择进制" />
                          </LinearLayout>

                          <androidx.cardview.widget.CardView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              app:cardCornerRadius="16dp"
                              app:cardElevation="2dp"
                              app:cardBackgroundColor="#FFFFFF"
                              android:layout_margin="0dp">

                              <FrameLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content">

                                  <EditText
                                      android:id="@+id/et_input2"
                                      android:layout_width="match_parent"
                                      android:layout_height="wrap_content"
                                      android:minHeight="72dp"
                                      android:textSize="24sp"
                                      android:textColor="#1A1A2E"
                                      android:textColorHint="#B0B0B0"
                                      android:hint="输入数值"
                                      android:inputType="text"
                                      android:paddingStart="20dp"
                                      android:paddingEnd="52dp"
                                      android:paddingTop="18dp"
                                      android:paddingBottom="18dp"
                                      android:background="@android:color/transparent"
                                      android:singleLine="true"
                                      android:fontFamily="monospace" />

                                  <ImageButton
                                      android:id="@+id/btn_copy2"
                                      android:layout_width="36dp"
                                      android:layout_height="36dp"
                                      android:src="@drawable/ic_copy"
                                      android:background="@drawable/ic_glass_circle"
                                      android:layout_gravity="end|top"
                                      android:layout_margin="8dp"
                                      android:contentDescription="复制" />
                              </FrameLayout>
                          </androidx.cardview.widget.CardView>
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/clock_result_area"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:visibility="gone"
                          android:padding="16dp"
                          android:layout_marginTop="8dp">

                          <androidx.cardview.widget.CardView
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              app:cardCornerRadius="16dp"
                              app:cardElevation="2dp"
                              app:cardBackgroundColor="#FFFFFF">

                              <TextView
                                  android:id="@+id/tv_clock_result"
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:padding="16dp"
                                  android:textSize="14sp"
                                  android:textColor="#1A1A2E"
                                  android:fontFamily="monospace"
                                  android:lineSpacingExtra="4dp"
                                  android:text="计算结果将显示在此处" />
                          </androidx.cardview.widget.CardView>
                      </LinearLayout>

                  </LinearLayout>
              </ScrollView>

              <ScrollView
                  android:id="@+id/about_content"
                  android:layout_width="match_parent"
                  android:layout_height="0dp"
                  android:layout_weight="1"
                  android:visibility="gone"
                  android:fillViewport="true">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:padding="32dp"
                      android:gravity="center_horizontal"
                      android:layout_marginTop="60dp">

                      <View
                          android:layout_width="80dp"
                          android:layout_height="80dp"
                          android:background="@drawable/ic_glass_circle"
                          android:layout_marginBottom="24dp" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="刷新率计算器"
                          android:textSize="22sp"
                          android:textStyle="bold"
                          android:textColor="#1A1A2E"
                          android:layout_marginBottom="8dp" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="RefreshRateCalculator v3.0"
                          android:textSize="14sp"
                          android:textColor="#999999"
                          android:layout_marginBottom="24dp" />

                      <TextView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textSize="14sp"
                          android:textColor="#666666"
                          android:lineSpacingExtra="6dp"
                          android:gravity="center"
                          android:text="支持常规进制互转（二进制/八进制/十进制/十六进制）与屏幕刷新率时钟频率计算。\n\n双向实时转换，液态玻璃风格图标，点击即可复制。\n\nPowered by GitHub Actions" />
                  </LinearLayout>
              </ScrollView>

              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id="@+id/bottom_nav"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:background="#FFFFFF"
                  app:menu="@menu/bottom_nav"
                  app:itemIconTint="@color/bottom_nav_color"
                  app:itemTextColor="@color/bottom_nav_color"
                  app:labelVisibilityMode="labeled"
                  android:elevation="8dp" />

          </LinearLayout>
          EOF



name: 自动编译生成 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 步骤 1：拉取仓库代码
      # ============================================================
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      # ============================================================
      # 步骤 2：初始化 Java 17 环境
      # ============================================================
      - name: 2. 初始化 Java 17 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ============================================================
      # 步骤 3：生成固定签名 keystore 与完整的 Android 项目源码
      # ============================================================
      - name: 3. 生成签名 keystore 与完整项目源码
        run: |
          # ---- 3a. 创建项目目录结构 ----
          mkdir -p app/src/main/java/com/example/refreshratecalculator/core
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          # ---- 3b. 生成签名 keystore ----
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore app/debug.keystore \
            -storepass android \
            -storetype PKCS12 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          # ---- 3c. 创建 build.gradle（项目级） ----
          cat > build.gradle << 'BUILD_GRADLE'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
BUILD_GRADLE

          # ---- 3d. 创建 app/build.gradle（模块级） ----
          cat > app/build.gradle << 'APP_BUILD_GRADLE'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.refreshratecalculator'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.refreshratecalculator'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
APP_BUILD_GRADLE

          # ---- 3e. 创建 settings.gradle ----
          cat > settings.gradle << 'SETTINGS_GRADLE'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'RefreshRateCalculator'
include ':app'
SETTINGS_GRADLE

          # ---- 3f. 创建 gradle.properties ----
          cat > gradle.properties << 'GRADLE_PROPERTIES'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
GRADLE_PROPERTIES

          # ---- 3g. 创建 AndroidManifest.xml ----
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'

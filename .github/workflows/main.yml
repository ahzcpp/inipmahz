name: 自动编译生成 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 2. 初始化 Java 17 环境
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. 生成签名 keystore 并写入完整项目源码
        run: |
          # ---------- 生成固定 debug.keystore ----------
          mkdir -p app
          keytool -genkeypair \
            -alias androiddebugkey \
            -keypass android \
            -keystore app/debug.keystore \
            -storepass android \
            -storetype PKCS12 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          # ---------- gradle.properties (关键修复) ----------
          cat > gradle.properties << 'PROPEOF'
          android.useAndroidX=true
          android.enableJetifier=true
          PROPEOF

          # ---------- settings.gradle ----------
          cat > settings.gradle << 'SETEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenCalc"
          include ':app'
          SETEOF

          # ---------- 项目级 build.gradle ----------
          cat > build.gradle << 'PROJEOF'
          plugins {
              id 'com.android.application' version '8.1.0' apply false
          }
          PROJEOF

          # ---------- app 模块 build.gradle ----------
          cat > app/build.gradle << 'APPEOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.example.screencalc'
              compileSdk 33
              defaultConfig {
                  applicationId "com.example.screencalc"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          APPEOF

          # ---------- AndroidManifest.xml ----------
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'MANEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="屏幕刷新率计算器"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANEOF

          # ---------- MainActivity.java ----------
          mkdir -p app/src/main/java/com/example/screencalc
          cat > app/src/main/java/com/example/screencalc/MainActivity.java << 'JAVAEOF'
          package com.example.screencalc;

          import android.os.Bundle;
          import android.text.TextUtils;
          import android.view.View;
          import android.widget.*;
          import androidx.appcompat.app.AppCompatActivity;
          import java.math.BigInteger;
          import java.util.*;

          public class MainActivity extends AppCompatActivity {

              EditText etBaseHz, etBaseClock, etTargetHz, etConvertInput;
              RadioGroup rgInputMode;
              TextView tvResult, tvConvertResult;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  etBaseHz = findViewById(R.id.et_base_hz);
                  etBaseClock = findViewById(R.id.et_base_clock);
                  etTargetHz = findViewById(R.id.et_target_hz);
                  etConvertInput = findViewById(R.id.et_convert_input);
                  rgInputMode = findViewById(R.id.rg_input_mode);
                  tvResult = findViewById(R.id.tv_result);
                  tvConvertResult = findViewById(R.id.tv_convert_result);

                  findViewById(R.id.btn_calc).setOnClickListener(v -> calculateRefresh());
                  findViewById(R.id.btn_convert).setOnClickListener(v -> convertNumbers());
              }

              private void calculateRefresh() {
                  String baseHzStr = etBaseHz.getText().toString().trim();
                  String baseClockStr = etBaseClock.getText().toString().trim();
                  String targetHzStr = etTargetHz.getText().toString().trim();

                  if (baseHzStr.isEmpty() || baseClockStr.isEmpty() || targetHzStr.isEmpty()) {
                      tvResult.setText("所有输入框均不能为空！");
                      return;
                  }

                  long baseHz, baseClockDec;
                  try {
                      baseHz = Long.parseLong(baseHzStr);
                      if (baseHz <= 0) throw new NumberFormatException();
                  } catch (NumberFormatException e) {
                      tvResult.setText("基准刷新率请输入正整数");
                      return;
                  }

                  try {
                      if (baseClockStr.startsWith("0x") || baseClockStr.startsWith("0X")) {
                          baseClockDec = Long.parseLong(baseClockStr.substring(2), 16);
                      } else {
                          baseClockDec = Long.parseLong(baseClockStr);
                      }
                  } catch (NumberFormatException e) {
                      tvResult.setText("基准时钟格式错误（支持十进制或0x十六进制）");
                      return;
                  }

                  String[] targets = targetHzStr.split("\\s+");
                  StringBuilder sb = new StringBuilder();
                  sb.append("======== 计算结果 ========\n");
                  sb.append("基准: ").append(baseHz).append(" Hz, 时钟 ")
                    .append(baseClockDec).append(" (0x").append(Long.toHexString(baseClockDec)).append(")\n\n");

                  for (String t : targets) {
                      try {
                          long targetHz = Long.parseLong(t);
                          if (targetHz <= 0) throw new NumberFormatException();

                          long targetClockDec = Math.round((baseClockDec * targetHz) / (double) baseHz);
                          String targetHzHex = Long.toHexString(targetHz);
                          String targetClockHex = Long.toHexString(targetClockDec);

                          sb.append("# ").append(targetHz).append(" Hz\n");
                          sb.append("qcom,mdss-dsi-panel-framerate = <0x").append(targetHzHex).append(">;\n");
                          sb.append("qcom,mdss-dsi-panel-clockrate = <0x").append(targetClockHex).append(">;\n");
                          sb.append("  (十进制时钟: ").append(targetClockDec).append(")\n\n");
                      } catch (NumberFormatException e) {
                          sb.append("[").append(t).append("] 不是有效刷新率，已跳过\n");
                      }
                  }
                  tvResult.setText(sb.toString());
              }

              private void convertNumbers() {
                  String input = etConvertInput.getText().toString().trim();
                  if (input.isEmpty()) {
                      tvConvertResult.setText("请输入数字");
                      return;
                  }

                  int selectedId = rgInputMode.getCheckedRadioButtonId();
                  BigInteger decimalValue;

                  try {
                      if (selectedId == R.id.rb_hex) {
                          String hex = input.startsWith("0x") || input.startsWith("0X") ?
                                  input.substring(2) : input;
                          decimalValue = new BigInteger(hex, 16);
                      } else {
                          decimalValue = new BigInteger(input, 10);
                      }
                  } catch (NumberFormatException e) {
                      tvConvertResult.setText("输入格式错误，请检查数字");
                      return;
                  }

                  String hex = decimalValue.toString(16).toUpperCase();
                  String oct = decimalValue.toString(8);
                  String bin = decimalValue.toString(2);

                  String result = "十进制: " + decimalValue.toString() + "\n"
                          + "十六进制: 0x" + hex + "\n"
                          + "八进制: 0" + oct + "\n"
                          + "二进制: " + bin;
                  tvConvertResult.setText(result);
              }
          }
          JAVAEOF

          # ---------- 布局文件 activity_main.xml ----------
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml << 'LAYOUTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="16dp">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="屏幕刷新率时钟计算"
                      android:textSize="18sp"
                      android:textStyle="bold"
                      android:layout_marginBottom="8dp"/>

                  <EditText
                      android:id="@+id/et_base_hz"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="基准刷新率 (Hz)"
                      android:inputType="number"/>

                  <EditText
                      android:id="@+id/et_base_clock"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="基准时钟频率 (十进制或0x十六进制)"
                      android:inputType="text"/>

                  <EditText
                      android:id="@+id/et_target_hz"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="目标刷新率，空格分隔 (如 90 120 144)"
                      android:inputType="text"/>

                  <Button
                      android:id="@+id/btn_calc"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="计算"/>

                  <TextView
                      android:id="@+id/tv_result"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:fontFamily="monospace"
                      android:textSize="14sp"
                      android:background="#F5F5F5"
                      android:padding="8dp"/>

                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:background="#ccc"
                      android:layout_marginVertical="16dp"/>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="多进制转换 (十 / 十六 / 八 / 二)"
                      android:textSize="18sp"
                      android:textStyle="bold"
                      android:layout_marginBottom="8dp"/>

                  <EditText
                      android:id="@+id/et_convert_input"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="输入数字"/>

                  <RadioGroup
                      android:id="@+id/rg_input_mode"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:layout_marginTop="4dp">

                      <RadioButton
                          android:id="@+id/rb_dec"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="十进制"
                          android:checked="true"/>

                      <RadioButton
                          android:id="@+id/rb_hex"
                          android:layout_width="0dp"
                          android:layout_height="wrap_content"
                          android:layout_weight="1"
                          android:text="十六进制"/>
                  </RadioGroup>

                  <Button
                      android:id="@+id/btn_convert"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="转换"/>

                  <TextView
                      android:id="@+id/tv_convert_result"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:fontFamily="monospace"
                      android:textSize="14sp"
                      android:background="#F5F5F5"
                      android:padding="8dp"/>
              </LinearLayout>
          </ScrollView>
          LAYOUTEOF

          # ---------- 资源文件 ----------
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml << 'STREOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">屏幕刷新率计算器</string>
          </resources>
          STREOF

      - name: 4. 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.0'
          generate-job-summary: true

      - name: 5. 编译生成 Debug APK
        run: gradle assembleDebug

      - name: 6. 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCalc-v1.0
          path: app/build/outputs/apk/debug/app-debug.apk
